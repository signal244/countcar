# botsort_stable.yaml 에서 ReID 만 끈 설정. CPU 에서 ReID 비용을 빼고 비교할 때 쓴다.
tracker_type: botsort

track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.45

track_buffer: 90

match_thresh: 0.8
fuse_score: true

gmc_method: none

with_reid: False
proximity_thresh: 0.3
appearance_thresh: 0.55
model: auto
